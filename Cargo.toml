[package]
name = "dbbyte"
version = "0.2.0"
edition = "2021"
description = "Official Rust SDK for the DBByte storage/CDN API"
license = "MIT"
repository = "https://github.com/dbbyte-dev/dbbyte-rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
